<script>
        // Particle System
        const canvas = document.getElementById('petal-canvas');
        const ctx = canvas.getContext('2d');
        const burstCanvas = document.getElementById('burst-canvas');
        const bCtx = burstCanvas.getContext('2d');
        
        let petals = [];
        let mouse = { x: -1000, y: -1000 };
        let animationFrame;
        let isStopped = false;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            burstCanvas.width = window.innerWidth;
            burstCanvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        class Petal {
            constructor(isBurst = false) {
                this.init(isBurst);
            }
            init(isBurst) {
                this.x = Math.random() * canvas.width;
                this.y = isBurst ? Math.random() * canvas.height : -20;
                this.size = Math.random() * 8 + 4;
                this.speed = Math.random() * 1.5 + 0.5;
                this.angle = Math.random() * Math.PI * 2;
                this.sway = Math.random() * 0.05 + 0.01;
                this.color = Math.random() > 0.5 ? '#FF8FAD' : '#FFB7CC';
                this.opacity = Math.random() * 0.6 + 0.2;
                this.isBurst = isBurst;
                this.vx = (Math.random() - 0.5) * (isBurst ? 10 : 2);
                this.vy = isBurst ? (Math.random() - 0.5) * 10 : this.speed;
            }
            update() {
                if (this.isBurst) {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vx *= 0.98;
                    this.vy *= 0.98;
                    this.opacity -= 0.005;
                } else {
                    this.y += this.speed;
                    this.angle += this.sway;
                    this.x += Math.sin(this.angle);

                    const dx = this.x - mouse.x;
                    const dy = this.y - mouse.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 100) {
                        const force = (100 - dist) / 100;
                        this.x += (dx / dist) * force * 5;
                        this.y += (dy / dist) * force * 5;
                    }

                    if (this.y > canvas.height) {
                        this.y = -20;
                        this.x = Math.random() * canvas.width;
                    }
                }
            }
            draw(context) {
                context.save();
                context.translate(this.x, this.y);
                context.rotate(this.angle);
                context.globalAlpha = this.opacity;
                context.fillStyle = this.color;
                context.beginPath();
                context.moveTo(0, 0);
                context.bezierCurveTo(this.size, -this.size, this.size*2, 0, 0, this.size*2);
                context.bezierCurveTo(-this.size*2, 0, -this.size, -this.size, 0, 0);
                context.fill();
                context.restore();
            }
        }

        function initPetals() {
            petals = Array.from({ length: 30 }, () => new Petal());
            animate();
        }

        function animate() {
            if (isStopped) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            petals.forEach(p => {
                p.update();
                p.draw(ctx);
            });
            animationFrame = requestAnimationFrame(animate);
        }

        function stopPetals() {
            isStopped = true;
            cancelAnimationFrame(animationFrame);
        }

        function openEnvelope() {
            const page1 = document.getElementById('page1');
            const page2 = document.getElementById('page2');
            const flap = document.getElementById('envelope-flap');
            const readBtn = document.getElementById('read-button');

            readBtn.style.opacity = '0';
            readBtn.style.pointerEvents = 'none';
            stopPetals();

            flap.style.transform = 'rotateX(-160deg)';

            setTimeout(() => {
                const rect = document.getElementById('envelope-group').getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                page1.style.transformOrigin = `${centerX}px ${centerY}px`;
                page1.style.transform = 'scale(10)';
                page1.style.opacity = '0';

                setTimeout(() => {
                    page2.classList.remove('hidden');
                    page2.classList.add('flex');
                    initPage2Petals();
                    setTimeout(() => {
                        document.querySelector('.message-staggered').classList.add('active');
                    }, 100);
                }, 600);
            }, 400);
        }

        let burstPetals = [];
        function initPage2Petals() {
            burstPetals = Array.from({ length: 60 }, () => new Petal(true));
            animateBurst();
        }

        function animateBurst() {
            bCtx.clearRect(0, 0, burstCanvas.width, burstCanvas.height);
            let active = false;
            burstPetals.forEach(p => {
                if (p.opacity > 0) {
                    p.update();
                    p.draw(bCtx);
                    active = true;
                }
            });
            if (active) requestAnimationFrame(animateBurst);
        }

        function closeMessage() {
            const page1 = document.getElementById('page1');
            const page2 = document.getElementById('page2');
            const flap = document.getElementById('envelope-flap');
            const readBtn = document.getElementById('read-button');

            document.querySelector('.message-staggered').classList.remove('active');
            
            setTimeout(() => {
                page1.style.opacity = '1';
                page1.style.transform = 'scale(1)';
                page2.classList.add('hidden');
                page2.classList.remove('flex');
                
                setTimeout(() => {
                    flap.style.transform = 'rotateX(0deg)';
                    readBtn.style.opacity = '1';
                    readBtn.style.pointerEvents = 'auto';
                    isStopped = false;
                    initPetals();
                }, 800);
            }, 400);
        }

        initPetals();
    </script>
